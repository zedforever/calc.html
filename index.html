
<!DOCTYPE html>
<html>
<head>
<title>My Java Script Calculator</title>

<script>
function add() {
    let a = Number(document.getElementById("fn").value);
    let b = Number(document.getElementById("sn").value);
    document.getElementById("ans").innerHTML = a + b;
}

function subtract() {
    let a = Number(document.getElementById("fn").value);
    let b = Number(document.getElementById("sn").value);
    document.getElementById("ans").innerHTML = a - b;
}

function multiply() {
    let a = Number(document.getElementById("fn").value);
    let b = Number(document.getElementById("sn").value);
    document.getElementById("ans").innerHTML = a * b;
}

function divide() {
    let a = Number(document.getElementById("fn").value);
    let b = Number(document.getElementById("sn").value);

    if (b === 0) {
        document.getElementById("ans").innerHTML =
            "Error: Cannot divide by zero.";
    } else {
        document.getElementById("ans").innerHTML = a / b;
    }
}

function squareRoot() {
    let a = Number(document.getElementById("fn").value);

    if (document.getElementById("fn").value.trim() === "") {
        document.getElementById("ans").innerHTML =
            "Please enter a number.";
    } else if (a < 0) {
        document.getElementById("ans").innerHTML =
            "Error: Negative square root.";
    } else {
        document.getElementById("ans").innerHTML = Math.sqrt(a);
    }
}
</script>
</head>

<body>

<h3>This is a practice JS document.</h3>

<p>
First number? <input id="fn" type="number" step="any"><br>
Second number? <input id="sn" type="number" step="any"><br><br>

<button onclick="add()">+</button>
<button onclick="subtract()">−</button>
<button onclick="multiply()">×</button>
<button onclick="divide()">÷</button>
<button onclick="squareRoot()">√</button>
</p>

<p>
Your Answer is: <span id="ans">______</span>
</p>

</body>
</html>
